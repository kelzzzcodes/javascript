<!DOCTYPE html>

<html>
  <head>
    <title>Learning JavaScript Basics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="p-2 bg-gray-900 text-white">
    <h1 class="text-2xl">Learning JavaScript Basics</h1>

    <div class="mt-8 flex flex-col gap-4 items-start">
      <button
        class="p-2 outline rounded-lg outline-white cursor-pointer"
        onclick="evenOrOddChecker()"
      >
        Even or Odd Checker
      </button>
      <button
        class="p-2 outline rounded-lg outline-white cursor-pointer"
        onclick="basicCalculator()"
      >
        Basic Calculator
      </button>
      <button
        class="p-2 outline rounded-lg outline-white cursor-pointer"
        onclick="votingEligibilityChecker()"
      >
        Voting Eligibility Checker
      </button>
      <button
        class="p-2 outline rounded-lg outline-white cursor-pointer"
        onclick="printNumbers1To10()"
      >
        Print Numbers from 1 to 10
      </button>

      <button
        class="p-2 outline rounded-lg outline-white cursor-pointer"
        onclick="multiplicationTableGenerator()"
      >
        Multiplication Table Generator
      </button>
      <button
        class="p-2 outline rounded-lg outline-white cursor-pointer"
        onclick="gradeChecker()"
      >
        Grade Checker
      </button>

      <button
        class="p-2 outline rounded-lg outline-white cursor-pointer"
        onclick="guessTheNumberGame()"
      >
        Guess the Number Game
      </button>
    </div>

    <script src="exercise7.js"></script>
  </body>
</html>
